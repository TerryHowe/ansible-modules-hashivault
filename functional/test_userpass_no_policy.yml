---
- hosts: localhost
  gather_facts: no
  vars:
    username: 'bob'
    userpass: 'Th3m@n!!'
    bobs_rules: >
      path "secret/*" {
        capabilities = ["create", "read", "update", "delete", "list"]
      }
      path "auth/token/create*" {
        capabilities = ["create", "read", "update", "delete", "list", "sudo"]
      }
      path "auth/token/lookup*" {
        capabilities = ["read", "list"]
      }
      path "auth/token/lookup/*" {
        capabilities = ["read", "list"]
      }
      path "sys/policy" {
        capabilities = ["read"]
      }
      path "sys/policy/*" {
        capabilities = ["create", "read", "update", "delete", "list"]
      }

  tasks:
    - name: Enable kv2 secret store
      hashivault_userpass:
        name: "{{username}}"
        state: absent
      no_log: True

    #- pause:
    #    prompt: "Make sure org.foo.FooOverload exception is not present"

    - name: Create userpass for bob via POST to omit the policies field
      # Shell out to curl rather than the uri module: under macOS fork safety
      # (OBJC_DISABLE_INITIALIZE_FORK_SAFETY) the uri module's Python ssl state
      # gets corrupted and every request to the plaintext vault port fails with
      # "[ASN1: NOT_ENOUGH_DATA]". curl avoids that code path entirely.
      command: >-
        curl -s -o /dev/null -w "%{http_code}"
        -X POST
        -H "X-Vault-Token: {{ lookup('env','VAULT_TOKEN') }}"
        -d '{"password": "{{userpass}}"}'
        {{ lookup('env','VAULT_ADDR') }}/v1/auth/userpass/users/{{username}}
      register: bob_create
      changed_when: true
      failed_when: bob_create.stdout != "204"

    - name: Update policies
      hashivault_userpass:
        name: "{{username}}"
        password: ""
        policies: ["policy-bob", "default"]
      register: 'hashivault_userpass_update_policies'
    - assert: { that: "hashivault_userpass_update_policies is changed" }
    - assert: { that: "hashivault_userpass_update_policies.rc == 0" }
